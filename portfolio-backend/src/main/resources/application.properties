# =============================================
# APPLICATION
# =============================================
spring.application.name=portfolio-backend
server.port=${PORT:8080}

# =============================================
# BASE DE DONNÉES (PostgreSQL - Railway)
# Railway fournit aussi JDBC_DATABASE_URL, utilisable directement ici
# =============================================
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =============================================
# MAIL (Outlook - gauthier.debra@outlook.fr)
# =============================================
spring.mail.host=smtp-mail.outlook.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =============================================
# CONFIG APPLICATIVE
# =============================================
app.mail.to=${MAIL_TO:gauthier.debra@outlook.fr}
app.mail.from=${MAIL_USERNAME}
app.cors.allowed-origins=${CORS_ORIGINS:https://gauthierdebra.vercel.app,http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:portfolio-admin}
app.admin.password=${ADMIN_PASSWORD:change-this-password}
