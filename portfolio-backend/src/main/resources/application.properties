# =============================================
# APPLICATION
# =============================================
spring.application.name=portfolio-backend
server.port=${PORT:8080}

# =============================================
# BASE DE DONNÉES (PostgreSQL - Railway)
# Compatible Railway et local
# =============================================
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =============================================
# CONFIG APPLICATIVE
# =============================================
app.mail.to=${MAIL_TO:gauthier.debra@outlook.fr}
app.mail.from=${MAIL_FROM:Portfolio <onboarding@resend.dev>}
app.mail.send-confirmation=${MAIL_SEND_CONFIRMATION:false}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
app.cors.allowed-origins=${CORS_ORIGINS:https://gauthierdebra.vercel.app,https://*.vercel.app,http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:portfolio-admin}
app.admin.password=${ADMIN_PASSWORD:change-this-password}
